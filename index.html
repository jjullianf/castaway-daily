<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{box-sizing:border-box}

html,body{overflow-x:hidden}#app{max-width:var(--appw,760px);margin:0 auto;padding:14px 16px 40px;overflow-x:hidden}
.hud{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:10px;margin-bottom:12px}
.panel{background:var(--panel);padding:8px 14px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);box-shadow:inset 0 0 0 2px var(--line)}

canvas#cv{width:100%;image-rendering:pixelated;display:block;cursor:crosshair;box-shadow:0 0 0 2px var(--line),0 20px 60px rgba(0,0,0,.5)}
#reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle,rgba(8,17,32,.75) 0%,rgba(8,17,32,.35) 60%,transparent 80%)}

@keyframes float{50%{transform:translateY(-6px)}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.it{background:var(--panel);box-shadow:inset 0 0 0 2px var(--line);padding:8px 4px 6px;text-align:center;cursor:pointer;font-size:16px;line-height:1;transition:transform .1s}
.it:hover{transform:translateY(-2px)}

h3{font-family:'Silkscreen';font-size:12px;letter-spacing:4px;color:var(--dim);margin:22px 0 10px;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .panel{text-align:center}
table{width:100%;border-collapse:collapse;font-size:20px}td{padding:6px 8px;border-bottom:2px solid var(--line)}tr.you{color:var(--pink)}

#ws{position:relative;overflow:hidden;touch-action:none;box-shadow:inset 0 0 0 2px var(--line);background:#2c4257 !important;
 background:radial-gradient(ellipse at 50% 55%,#3f8f5f 0%,#2f7a55 30%,#c9ae6e 46%,#d9bf7f 52%,#3d86a8 60%,#1c4a6e 75%,#0e2540 100%)}
#hintBtn{position:absolute;top:8px;left:8px;font-family:'Silkscreen';font-size:10px;letter-spacing:2px;background:var(--panel);color:var(--gold);border:2px solid var(--line);padding:6px 10px;cursor:pointer;z-index:5}
.el.can img{filter:drop-shadow(0 0 1px #ffc94d) drop-shadow(0 0 4px rgba(255,201,77,.6));animation:canp 1.1s ease-in-out infinite}@keyframes canp{50%{transform:scale(1.04)}}.el.can span{color:var(--gold)}

.basics{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}.basics img{width:28px;height:28px;image-rendering:pixelated;display:block;margin:0 auto}.basics small{display:block;font-size:13px;color:var(--dim);text-align:center}

.cx{text-align:center;font-size:13px;padding:4px 2px;background:#162843}.cx img{width:32px;height:32px;image-rendering:pixelated;display:block;margin:0 auto 2px}.cx.nw{box-shadow:inset 0 0 0 2px var(--gold)}

canvas.shake{animation:shk .12s linear infinite}@keyframes shk{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}

.li.maxed{opacity:.45;filter:grayscale(.8)}.li.maxed::after{content:"MAXED";font-family:'Silkscreen';font-size:8px;color:#ff8fab;margin-left:auto}

#ws::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:16px 16px;pointer-events:none}

#clear{position:absolute;top:8px;right:8px;font-family:'Silkscreen';font-size:10px;letter-spacing:2px;background:var(--panel);color:var(--ink);border:2px solid var(--line);padding:6px 10px;cursor:pointer;z-index:5}
.el{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;z-index:2}

.el span{margin-top:2px}
#sea{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;
 font-family:'Silkscreen';font-size:10px;letter-spacing:3px;color:#cdefff;background:repeating-linear-gradient(90deg,#2a6fb0 0 14px,#2f7cc2 14px 28px);background-size:28px 100%;
 animation:waves 2s linear infinite;box-shadow:inset 0 4px 0 #8fd3ff,inset 0 6px 0 #5ab0e6;transition:height .15s}
#sea.hot{height:84px;box-shadow:inset 0 4px 0 #fff,inset 0 0 30px #8fd3ff}@keyframes waves{to{background-position:28px 0}}

.el span{font-size:15px;color:#fff;text-shadow:0 1px 0 #000,0 0 4px #000;white-space:nowrap;pointer-events:none}
.el.drag{z-index:10;cursor:grabbing}.el.drag img{transform:scale(1.15)}

.li{display:flex;align-items:center;gap:8px;padding:4px 6px;cursor:grab;user-select:none;-webkit-user-select:none;font-size:17px;touch-action:pan-y}

 body.crafting{position:fixed;inset:0;overflow:hidden}

function spawn(n,cx,cy,pop){const p=cx==null?anySpot():freeSpot(cx,cy);if(!p){$('log').textContent='Board full! Drag items into the sea.';sfx.fail();return null}return mkEl(n,p[0],p[1],pop)}
function beginDrag(d,e){sfx.pick();markPartners(d.dataset.n);d.moved=false;d.classList.add('drag');drag={d,sx:e.clientX,sy:e.clientY}}
function overlapTarget(d){const x=parseFloat(d.style.left),y=parseFloat(d.style.top);let bestT=null,bd=46;
  ws.querySelectorAll('.el').forEach(o=>{if(o===d)return;const dd=Math.hypot(parseFloat(o.style.left)-x,parseFloat(o.style.top)-y);if(dd<bd){bd=dd;bestT=o}});return bestT}
document.addEventListener('pointermove',e=>{
  if(pending&&!drag&&Math.hypot(e.clientX-pending.x,e.clientY-pending.y)>8){const r=ws.getBoundingClientRect();
    const d=mkEl(pending.n,e.clientX-r.left,e.clientY-r.top);beginDrag(d,e);d.moved=true;pending=null}
  if(!drag)return;const r=ws.getBoundingClientRect(),d=drag.d;
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4)d.moved=true;
  d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';
  ws.querySelectorAll('.el.target').forEach(o=>o.classList.remove('target'));const sr=$('sea').getBoundingClientRect(),overSea=e.clientY>sr.top-6;$('sea').classList.toggle('hot',overSea);const t=overSea?null:overlapTarget(d);if(t)t.classList.add('target');
});
document.addEventListener('pointerup',e=>{
  if(pending){const r=ws.getBoundingClientRect();spawn(pending.n,null,null,true);sfx.pop();pending=null;return}
  if(!drag)return;const d=drag.d;drag=null;d.classList.remove('drag');ws.querySelectorAll('.el.can').forEach(o=>o.classList.remove('can'));ws.querySelectorAll('.el.target').forEach(o=>o.classList.remove('target'));
  const r=ws.getBoundingClientRect();
  const sr=$('sea').getBoundingClientRect();$('sea').classList.remove('hot');if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){d.remove();return}
  if(e.clientY>sr.top-6){sfx.sink();d.classList.add('sinking');setTimeout(()=>d.remove(),500);return}
  const t=overlapTarget(d);if(t&&d.moved)combine(d,t);
});
document.addEventListener('pointercancel',()=>{pending=null});
function newFrom(n){const I=idx()[n]||[],iv=new Set(inv);return I.filter(([o,k])=>iv.has(o)&&!iv.has(REC[k][0])).map(x=>x[1])}
function _oldNew(n){return Object.keys(REC).filter(k=>{const [a,b]=k.split('+');return(a===n||b===n)&&!inv.includes(REC[k][0])&&inv.includes(a)&&inv.includes(b)})}
function markPartners(n){const ok=new Set(newFrom(n).map(k=>{const [a,b]=k.split('+');return a===n?b:a}));ws.querySelectorAll('.el').forEach(o=>o.classList.toggle('can',ok.has(o.dataset.n)))}
function saveRun(){if(phase==='end'||TUT)return;store.set('cw_run',{date:TODAY,caught:inv.slice(BASE.length,BASE.length+(5-casts)),lucky:luckyGot,bonus:bonusT,stage:(phase==='fish'||phase==='arrive')?'fish':'craft',made,total,best})}
let tutOn=false;function startTut(){const w=ws.clientWidth,h=ws.clientHeight;const a=spawn('Sand',w*.35,h*.42),b=spawn('Sun',w*.65,h*.42);[a,b].forEach(e=>e&&e.classList.add('tut'));tutOn=true;$('log').innerHTML='👉 Try it: drag <b>Sand</b> onto <b>Sun</b>'}
let hintsLeft=3,pendingTimer=null;
function updateHints(){list.querySelectorAll('.li').forEach(li=>{const c=newFrom(li.dataset.n).length,b=li.querySelector('.cnt');b.textContent=c||'';b.classList.toggle('done',!c)})}
function combine(a,b){
  const A=a.dataset.n,B=b.dataset.n,r=REC[[A,B].sort().join('+')];
  if(!r){sfx.fail();[a,b].forEach(o=>{o.classList.remove('shake');void o.offsetWidth;o.classList.add('shake')});$('log').innerHTML=`${A} + ${B} = nothing...`;return}
  const x=parseFloat(b.style.left),y=parseFloat(b.style.top);a.remove();b.remove();mkEl(r[0],x,y,true);
  if(tutOn){tutOn=false;store.set('cw_tut',true);ws.querySelectorAll('.el.tut').forEach(o=>o.classList.remove('tut'))}
  if(!inv.includes(r[0])){inv.push(r[0]);made.push(r[0]);setTimeout(saveRun,0);freshName=r[0];(r[1]>=100?sfx.special():sfx.win(r[1]));total+=r[1];if(!best||r[1]>best[1])best=r;$('score').textContent=total;
    reveal(r[0],r[1]>=100?`★ SPECIAL · +${r[1]} PTS ★`:`NEW · +${r[1]} PTS`,r[1]>=100?'#ffc94d':'#5ee1ff',`${A} + ${B}`);$('log').innerHTML=`New: <b>${r[0]}</b> · +${r[1]} pts`;renderSide()}
  else{sfx.pop();$('log').innerHTML=`${r[0]} (already discovered)`}
}
$('hintBtn').onclick=()=>{if(hintsLeft<=0)return;const opts=[];inv.forEach(n=>newFrom(n).forEach(k=>opts.push(k)));
  if(!opts.length){$('log').textContent='No new combinations left - nice!';return}const k=opts[Math.floor(rnd()*opts.length)],[a,b]=k.split('+');hintsLeft--;
  $('hintBtn').textContent='HINT ('+hintsLeft+')';$('log').innerHTML=`Hint: try <b>${a}</b> + <b>${b}</b>`;sfx.pop()};
$('clear').onclick=()=>ws.querySelectorAll('.el').forEach(o=>o.remove());
// everything reachable from the starting items
function potential(start){const S=new Set(start);let sum=0,top=null,grew=true;
  while(grew){grew=false;for(const k in REC){const [a,b]=k.split('+'),[res,p]=REC[k];
    if(S.has(a)&&S.has(b)&&!S.has(res)){S.add(res);sum+=p;if(!top||p>top[1])top=[res,p];grew=true}}}return{sum,top}}
function end(){
  sfx.end();document.body.classList.remove('crafting');phase='end';timeLeft=0;$('craftUI').classList.add('hide');$('endUI').classList.remove('hide');$('hint').classList.add('hide');
  $('phaseLbl').textContent='TIME\'S UP';$('log').textContent='';
  const caught=inv.slice(BASE.length,BASE.length+5),RAR=Object.fromEntries(LOOT.map(l=>[l[0],l[1]]));
  const RS=(()=>{const S=new Set([...BASE,...caught]);let g=true;while(g){g=false;for(const k in REC){const [a,b]=k.split('+');if(S.has(a)&&S.has(b)&&!S.has(REC[k][0])){S.add(REC[k][0]);g=true}}}return S})();
  const teaser=[...RS].filter(n=>!inv.includes(n)&&PTS[n]).sort((a,b)=>PTS[b]-PTS[a]).slice(0,3);store.set('cw_tut',true);store.set('cw_run',null);
  const before=new Set(codexList()),found=[...inv.filter(n=>!BASE.includes(n)),...luckyGot],fresh=found.filter(n=>!before.has(n));
  store.set('cw_codex',[...before,...fresh]);store.set('cw_last_new',fresh);store.set('cw_played',TODAY);store.set('cw_last',{score:total,best:best?best[0]:null,fresh:fresh.length});
  if(!DEV)$('againBtn').classList.add('hide');
  $('eDate').textContent='CASTAWAY DAILY · '+TODAY;
  $('eBest').innerHTML=best?`${img(best[0])}<div class="lbl">BEST CREATION</div><b>${best[0]}</b>`:`<div class="lbl" style="margin-top:12px">NO CREATIONS THIS TIME</div>`;
  $('fScore').textContent=total;$('ePct').innerHTML=`${made.length} CREATIONS`;
  $('eCatch').innerHTML=caught.map(n=>`<span style="--rc:${RCOL[RAR[n]]}">${img(n)}</span>`).join('');
  $('eFinds').innerHTML=`<b>+${fresh.length}</b> new finds · ${before.size+fresh.length} in your collection`;
  $('fNote').textContent='New catch tomorrow. Your finds are saved.';
  $('codexEnd').onclick=showCodex;
  const SQ={c:'⬜',u:'🟩',r:'🟦',e:'🟪',l:'🟨'};
  const txt=`🏝 Castaway Daily · ${TODAY}\n🎣 ${caught.map(n=>SQ[RAR[n]]).join('')}\n⭐ ${total} pts · ${made.length} creations${best?`\n🏆 ${best[0]}`:''}`;
  $('shareBtn').onclick=()=>{const done=()=>{$('shareBtn').textContent='COPIED!';setTimeout(()=>$('shareBtn').textContent='SHARE',1500)};
    try{navigator.clipboard.writeText(txt).then(done,()=>{$('fNote').innerHTML='<textarea readonly style="width:100%;max-width:360px;height:90px;background:var(--panel);color:var(--ink);font-family:inherit">'+txt+'</textarea>';$('fNote').querySelector('textarea').select()})}catch(e){}};
}

// ---------- first-visit tutorial ----------
var TUT=false;const TUT_CATCH=['Shell','Starfish','Coconut','Egg','Banana Peel'];
function tutDone(){store.set('cw_tut2',true);store.set('cw_tut',true);location.reload()}
function showIntro(){const h=document.createElement('div');h.id='help';
  h.innerHTML=`<div class="box" style="text-align:center"><h4>WELCOME TO CASTAWAY</h4><p style="margin:0 0 6px">Every day you fish 5 items from your raft, then craft them into new things on an island.</p><p style="color:var(--dim);margin:0">Want a 1-minute walkthrough?</p>
  <button class="btn" id="tGo">SHOW ME HOW ▶</button><button class="btn2" id="tSkip">SKIP, I KNOW HOW</button></div>`;document.body.appendChild(h);
  h.querySelector('#tGo').onclick=()=>{sfx.open();h.remove();beginTutorial()};
  h.querySelector('#tSkip').onclick=()=>{h.remove();store.set('cw_tut2',true);showHelp(false)}}
function beginTutorial(){TUT=true;store.set('cw_tut',true);TUT_CATCH.forEach((n,i)=>{inv.push(n);const l=LOOT.find(x=>x[0]===n),p=$('pips').children[i];if(p&&l){p.style.background=RCOL[l[1]]}});casts=0;$('hint').classList.add('hide');phase='craft';startCraft()}
const cntB=n=>ws.querySelectorAll(`.el[data-n="${n}"]:not(.fading):not(.sinking)`).length;
const elB=n=>ws.querySelector(`.el[data-n="${n}"]:not(.fading)`);
let tStep=0,tIv=null,tWait=0;
const TSTEPS=[
 {t:()=>`Your 5 catches: <span class="tcat">${TUT_CATCH.map(img).join('')}</span><br>They're in your item list with the island basics. <b>Tap Wood</b> in the list.`,hi:()=>list.querySelector('.li[data-n="Wood"]'),done:()=>cntB('Wood')>=1},
 {t:()=>`<b>Double-tap the Wood</b> on the board to copy it.`,hi:()=>elB('Wood'),done:()=>cntB('Wood')>=2},
 {t:()=>`Now <b>drag one Wood onto the other</b> to combine them.`,hi:()=>elB('Wood'),done:()=>inv.includes('Planks')},
 {t:()=>`You made <b>Planks</b> and scored points! <b>Double-tap the Planks</b> to copy them.`,hi:()=>elB('Planks'),done:()=>cntB('Planks')>=2},
 {t:()=>`<b>Drag Planks onto Planks.</b>`,hi:()=>elB('Planks'),done:()=>inv.includes('Raft')},
 {t:()=>`A <b>Raft</b>! With today's items it can't make anything new, so it's <b>maxed</b> and fades away. That keeps your board tidy.`,wait:4200},
 {t:()=>`Now mix a <b>catch</b> with a <b>basic</b>: tap <b>Coconut</b> and <b>Sand</b> in the list, then drag one onto the other.`,hi:()=>!cntB('Coconut')?list.querySelector('.li[data-n="Coconut"]'):!cntB('Sand')?list.querySelector('.li[data-n="Sand"]'):elB('Coconut'),done:()=>inv.includes('Palm Tree')},
 {t:()=>`🌴 A <b>Palm Tree</b>! Mixing your catches with the basics unlocks most creations.<br>That's it!<br>✨ Holding an item, a <span style="color:var(--gold)">gold glow</span> shows what it combines with.<br><span class="demo">3</span> = new things an item can still make.<br>🌊 Drag items into the sea to clear the board.<br><b>You get 2 minutes each day. Have fun!</b>`,end:true},
];
function coachStart(){const c=document.createElement('div');c.id='coach';ws.appendChild(c);tStep=0;coachShow();
  tIv=setInterval(()=>{const S=TSTEPS[tStep];document.querySelectorAll('.tutHi').forEach(e=>e.classList.remove('tutHi'));
    if(S.hi){const e=S.hi();if(e)e.classList.add('tutHi')}
    if(S.done&&S.done()){tStep++;coachShow()}else if(S.wait&&Date.now()>tWait){tStep++;coachShow()}},250)}
function coachShow(){const S=TSTEPS[tStep],c=$('coach');if(S.wait)tWait=Date.now()+S.wait;
  c.innerHTML=`<div class="cstep">STEP ${Math.min(tStep+1,TSTEPS.length)} / ${TSTEPS.length}</div><div>${S.t()}</div>${S.end?'<button class="btn" id="cEnd">START FISHING ▶</button>':'<button class="cskip" id="cSkip">Skip tutorial</button>'}`;
  const e=c.querySelector('#cEnd');if(e)e.onclick=()=>{clearInterval(tIv);tutDone()};const k=c.querySelector('#cSkip');if(k)k.onclick=()=>{clearInterval(tIv);tutDone()};sfx.pop()}

// resume an unfinished run (stops refresh-rerolling once DEV is off)
var RESUMED=false;
(()=>{if(DEV)return;const run=store.get('cw_run',null);if(!run||run.date!==TODAY||store.get('cw_played',null)===TODAY)return;
  RESUMED=true;run.caught.forEach((n,i)=>{const l=LOOT.find(x=>x[0]===n);pool=pool.filter(p=>p!==l);inv.push(n);const pip=$('pips').children[i];if(pip&&l){pip.style.background=RCOL[l[1]];pip.style.boxShadow=`0 0 8px ${RCOL[l[1]]}`}});
  (run.lucky||[]).forEach(n=>{luckyGot.push(n);pool=pool.filter(p=>p[0]!==n)});bonusT=run.bonus||0;timeLeft+=bonusT;casts=5-run.caught.length;$('valL').textContent=casts;
  if(run.stage==='craft'){run.made.forEach(n=>{inv.push(n);made.push(n)});total=run.total||0;best=run.best||null;phase='craft';end();return}
  $('phaseLbl').textContent=casts?`CAST ${6-casts} OF 5`:'LAND AHOY';$('log').textContent='Welcome back! Your catch is saved.';
  if(casts===0)setTimeout(()=>{phase='arrive'},500)})();
</script></body></html>
